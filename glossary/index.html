<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glossary &amp; flashcards | AIFDE Notes</title>
<meta name="description" content="Every key term from the AIFDE notes in one place, with a flashcard mode for revision.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&family=Nunito:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="../assets/style.css?v=20261014122708">
<script>try{var t=localStorage.getItem('aifde:theme'),f=localStorage.getItem('aifde:font');if(t)document.documentElement.setAttribute('data-theme',JSON.parse(t));if(f&&JSON.parse(f)==='clean')document.documentElement.setAttribute('data-font','clean')}catch(e){}</script>
</head>
<body data-root="../" data-page="glossary">

<main class="wrap ruled">
  <section aria-labelledby="g-title">
    <p class="eyebrow">Revise faster</p>
    <h1 id="g-title">Glossary</h1>
    <svg class="squiggle" viewBox="0 0 210 15" aria-hidden="true"><path d="M3 9 C 24 2, 44 14, 68 8 S 112 2, 136 9 S 178 14, 207 7"/></svg>
    <p class="lede">Every key term from every note, A to Z. Each one links back to where it’s explained. Switch to <mark>flashcards</mark> to test yourself.</p>
    <p class="meta" id="gcount"></p>
    <div class="filters" role="group" aria-label="Mode">
      <button type="button" data-mode="list" aria-pressed="true">📖 A–Z list</button>
      <button type="button" data-mode="flash" aria-pressed="false">🃏 Flashcards</button>
    </div>
    <div class="tools">
      <label for="gq" class="sr">Filter terms</label>
      <input id="gq" class="search" type="search" placeholder="Filter terms, e.g. pipe, TCP, decorator…" autocomplete="off">
    </div>
    <div class="filters" id="gfilters" role="group" aria-label="Filter by module"></div>

    <div id="gl-wrap" class="stack">
      <nav class="letters" id="letters" aria-label="Jump to letter"></nav>
      <div id="gl" class="stack"><p class="empty">Loading terms…</p></div>
    </div>

    <div id="flash" class="stack" hidden>
      <div class="flash">
        <div class="cardf" id="fc" tabindex="0" role="button" aria-label="Flashcard, press to flip">
          <div class="side front" id="fc-front"></div>
          <div class="side back" id="fc-back"></div>
        </div>
      </div>
      <p class="meta" id="fc-pos" style="text-align:center;max-width:none"></p>
      <div class="actions" style="justify-content:center">
        <button type="button" class="btn small" id="fc-prev">← Prev</button>
        <button type="button" class="btn small" id="fc-shuffle">⤮ Shuffle</button>
        <button type="button" class="btn small primary" id="fc-next">Next →</button>
      </div>
    </div>
  </section>
</main>

<script src="../assets/site.js?v=20261014122708"></script>
</body>
</html>
