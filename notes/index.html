<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>All notes | AIFDE Notes</title>
<meta name="description" content="Every AIFDE note, module by module, with full-text search across all sections.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&family=Nunito:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="../assets/style.css">
<script>try{var t=localStorage.getItem('aifde:theme'),f=localStorage.getItem('aifde:font');if(t)document.documentElement.setAttribute('data-theme',JSON.parse(t));if(f&&JSON.parse(f)==='clean')document.documentElement.setAttribute('data-font','clean')}catch(e){}</script>
</head>
<body data-root="../" data-page="notes">

<main class="wrap ruled">
  <section aria-labelledby="notes-title">
    <p class="eyebrow">The notebook</p>
    <h1 id="notes-title">All notes</h1>
    <svg class="squiggle" viewBox="0 0 210 15" aria-hidden="true"><path d="M3 9 C 24 2, 44 14, 68 8 S 112 2, 136 9 S 178 14, 207 7"/></svg>
    <p class="lede">Read them in order, module by module. Search looks <mark>inside every section</mark> of every note, not just the titles.</p>
    <div class="tools">
      <label for="q" class="sr">Search notes</label>
      <input id="q" class="search" type="search" placeholder="Search anything: grep, subnet, Pydantic, inheritance, tokens…" autocomplete="off">
    </div>
    <div class="filters" id="filters" role="group" aria-label="Filter by module"></div>
    <p class="meta" id="count" aria-live="polite"></p>
    <ul class="note-list" id="all-notes"><li class="empty">Loading notes…</li></ul>
    <div id="hits-wrap" class="stack" hidden>
      <h2>Found inside the notes</h2>
      <ul class="hits" id="hits"></ul>
    </div>
  </section>
</main>

<script src="../assets/site.js"></script>
</body>
</html>
